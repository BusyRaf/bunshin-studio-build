<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }</style>
    <marker id="arr-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#F08948"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="#0B1E30" rx="12"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" fill="#E8EEF4" font-size="13" font-weight="600" letter-spacing="0.2">Tournament Entry — Privacy-Preserving Snapshot</text>

  <!-- ── CATCHES TABLE (private) ── -->
  <rect x="16" y="44" width="270" height="240" fill="#0F2638" rx="8" stroke="#1D3D5E" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="16" y="44" width="270" height="36" fill="#162F47" rx="8"/>
  <rect x="16" y="62" width="270" height="18" fill="#162F47"/>
  <text x="36" y="66" fill="#E8EEF4" font-size="12" font-weight="700">catches</text>
  <text x="270" y="66" text-anchor="end" fill="#C0392B" font-size="16">🔒</text>
  <text x="270" y="82" text-anchor="end" fill="#5B3A3A" font-size="9" font-weight="600">PRIVATE · RLS enforced</text>

  <!-- Fields -->
  <text x="36" y="104" fill="#5B8BAA" font-size="10">user_id</text>
  <text x="200" y="104" fill="#E8EEF4" font-size="10">@you</text>

  <text x="36" y="124" fill="#5B8BAA" font-size="10">species</text>
  <text x="200" y="124" fill="#E8EEF4" font-size="10">Largemouth Bass</text>

  <text x="36" y="144" fill="#5B8BAA" font-size="10">weight_kg</text>
  <text x="200" y="144" fill="#E8EEF4" font-size="10">2.72</text>

  <text x="36" y="164" fill="#5B8BAA" font-size="10">length_cm</text>
  <text x="200" y="164" fill="#E8EEF4" font-size="10">51.2</text>

  <text x="36" y="184" fill="#5B8BAA" font-size="10">gps_point</text>
  <text x="200" y="184" fill="#E8EEF4" font-size="10">30.3894, -97.9022</text>

  <text x="36" y="204" fill="#5B8BAA" font-size="10">notes</text>
  <text x="200" y="204" fill="#E8EEF4" font-size="10">Texas Rig, 4" Senko</text>

  <text x="36" y="224" fill="#5B8BAA" font-size="10">photo_paths</text>
  <text x="200" y="224" fill="#E8EEF4" font-size="10">[ signed URLs ]</text>

  <text x="36" y="244" fill="#5B8BAA" font-size="10">conditions</text>
  <text x="200" y="244" fill="#E8EEF4" font-size="10">72°F, 14 kt SW</text>

  <!-- Divider line -->
  <line x1="36" y1="96" x2="270" y2="96" stroke="#1D3D5E" stroke-width="1"/>
  <line x1="36" y1="116" x2="270" y2="116" stroke="#1D3D5E" stroke-width="0.5"/>
  <line x1="36" y1="136" x2="270" y2="136" stroke="#1D3D5E" stroke-width="0.5"/>
  <line x1="36" y1="156" x2="270" y2="156" stroke="#1D3D5E" stroke-width="0.5"/>
  <line x1="36" y1="176" x2="270" y2="176" stroke="#1D3D5E" stroke-width="0.5"/>
  <line x1="36" y1="196" x2="270" y2="196" stroke="#1D3D5E" stroke-width="0.5"/>
  <line x1="36" y1="216" x2="270" y2="216" stroke="#1D3D5E" stroke-width="0.5"/>
  <line x1="36" y1="236" x2="270" y2="236" stroke="#1D3D5E" stroke-width="0.5"/>

  <!-- ── CENTER ARROW + LABEL ── -->
  <line x1="286" y1="150" x2="438" y2="150" stroke="#F08948" stroke-width="2.5" marker-end="url(#arr-orange)"/>
  <text x="362" y="137" text-anchor="middle" fill="#F08948" font-size="10" font-weight="700">submit to tournament</text>
  <text x="362" y="172" text-anchor="middle" fill="#5B8BAA" font-size="9">fields snapshot</text>
  <text x="362" y="184" text-anchor="middle" fill="#5B8BAA" font-size="9">at submit time</text>

  <!-- Blocked rows note -->
  <text x="362" y="214" text-anchor="middle" fill="#2A4A65" font-size="9">gps · notes · conditions</text>
  <text x="362" y="226" text-anchor="middle" fill="#2A4A65" font-size="9">not copied →</text>

  <!-- ── TOURNAMENT_ENTRIES TABLE ── -->
  <rect x="444" y="44" width="270" height="240" fill="#0F2638" rx="8" stroke="#1D3D5E" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="444" y="44" width="270" height="36" fill="#162F47" rx="8"/>
  <rect x="444" y="62" width="270" height="18" fill="#162F47"/>
  <text x="464" y="66" fill="#E8EEF4" font-size="12" font-weight="700">tournament_entries</text>
  <text x="698" y="82" text-anchor="end" fill="#4CA87A" font-size="9" font-weight="600">VISIBLE TO MEMBERS</text>

  <!-- Fields -->
  <text x="464" y="104" fill="#5B8BAA" font-size="10">tournament_id</text>
  <text x="644" y="104" fill="#E8EEF4" font-size="10">Weekend Bass Bash</text>

  <text x="464" y="124" fill="#F08948" font-size="10">species ★</text>
  <text x="644" y="124" fill="#E8EEF4" font-size="10">Largemouth Bass</text>

  <text x="464" y="144" fill="#F08948" font-size="10">weight_lbs ★</text>
  <text x="644" y="144" fill="#E8EEF4" font-size="10">6.0</text>

  <text x="464" y="164" fill="#F08948" font-size="10">length_in ★</text>
  <text x="644" y="164" fill="#E8EEF4" font-size="10">20.1</text>

  <text x="464" y="184" fill="#F08948" font-size="10">first_photo ★</text>
  <text x="644" y="184" fill="#E8EEF4" font-size="10">[ snapshot URL ]</text>

  <text x="464" y="204" fill="#F08948" font-size="10">submitted_at ★</text>
  <text x="644" y="204" fill="#E8EEF4" font-size="10">May 22 6:25 AM</text>

  <text x="464" y="224" fill="#2A4A65" font-size="10">gps_point</text>
  <text x="644" y="224" fill="#2A4A65" font-size="10">— not copied</text>

  <text x="464" y="244" fill="#2A4A65" font-size="10">notes</text>
  <text x="644" y="244" fill="#2A4A65" font-size="10">— not copied</text>

  <!-- Divider lines -->
  <line x1="464" y1="96" x2="698" y2="96" stroke="#1D3D5E" stroke-width="1"/>
  <line x1="464" y1="116" x2="698" y2="116" stroke="#1D3D5E" stroke-width="0.5"/>
  <line x1="464" y1="136" x2="698" y2="136" stroke="#1D3D5E" stroke-width="0.5"/>
  <line x1="464" y1="156" x2="698" y2="156" stroke="#1D3D5E" stroke-width="0.5"/>
  <line x1="464" y1="176" x2="698" y2="176" stroke="#1D3D5E" stroke-width="0.5"/>
  <line x1="464" y1="196" x2="698" y2="196" stroke="#1D3D5E" stroke-width="0.5"/>
  <line x1="464" y1="216" x2="698" y2="216" stroke="#1D3D5E" stroke-width="0.5"/>
  <line x1="464" y1="236" x2="698" y2="236" stroke="#1D3D5E" stroke-width="0.5"/>

  <!-- Legend -->
  <rect x="720" y="44" width="64" height="240" fill="#0F2638" rx="8" stroke="#1D3D5E" stroke-width="1.5"/>
  <text x="752" y="66" text-anchor="middle" fill="#5B8BAA" font-size="8.5" font-weight="700">LEGEND</text>
  <rect x="730" y="76" width="44" height="14" fill="#0B1E30" rx="2"/>
  <text x="752" y="87" text-anchor="middle" fill="#F08948" font-size="8">★ snapshot</text>
  <rect x="730" y="98" width="44" height="14" fill="#0B1E30" rx="2"/>
  <text x="752" y="109" text-anchor="middle" fill="#2A4A65" font-size="8">— omitted</text>

  <text x="752" y="160" text-anchor="middle" fill="#5B8BAA" font-size="8">Late edits</text>
  <text x="752" y="173" text-anchor="middle" fill="#5B8BAA" font-size="8">to a catch</text>
  <text x="752" y="186" text-anchor="middle" fill="#5B8BAA" font-size="8">don't change</text>
  <text x="752" y="199" text-anchor="middle" fill="#5B8BAA" font-size="8">standings.</text>
  <text x="752" y="220" text-anchor="middle" fill="#4CA87A" font-size="8" font-weight="600">Correct</text>
  <text x="752" y="232" text-anchor="middle" fill="#4CA87A" font-size="8" font-weight="600">by design.</text>
</svg>
