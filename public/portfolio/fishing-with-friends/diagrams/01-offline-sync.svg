<svg width="800" height="320" viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }</style>
    <marker id="arr-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#F08948"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4A7FA0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="320" fill="#0B1E30" rx="12"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" fill="#E8EEF4" font-size="13" font-weight="600" letter-spacing="0.2">Offline-First Sync Architecture</text>

  <!-- ── DEVICE ZONE ── -->
  <rect x="16" y="44" width="330" height="256" fill="#0F2638" rx="8" stroke="#1D3D5E" stroke-width="1.5"/>
  <text x="32" y="64" fill="#F08948" font-size="9.5" font-weight="700" letter-spacing="2">ON DEVICE</text>

  <!-- User taps Save -->
  <rect x="32" y="74" width="298" height="48" fill="#162F47" rx="6"/>
  <text x="181" y="94" text-anchor="middle" fill="#E8EEF4" font-size="12" font-weight="600">User taps Save</text>
  <text x="181" y="110" text-anchor="middle" fill="#5B8BAA" font-size="10">catch entry · photo · any feature</text>

  <!-- Arrow down -->
  <line x1="181" y1="122" x2="181" y2="140" stroke="#F08948" stroke-width="2" marker-end="url(#arr-orange)"/>

  <!-- SQLite Outbox -->
  <rect x="32" y="142" width="298" height="52" fill="#162F47" rx="6" stroke="#F08948" stroke-width="1.5"/>
  <text x="181" y="163" text-anchor="middle" fill="#E8EEF4" font-size="12" font-weight="600">SQLite Outbox (Drift)</text>
  <text x="181" y="180" text-anchor="middle" fill="#5B8BAA" font-size="10">writes locally · returns immediately · no spinner</text>

  <!-- Arrow down to FS -->
  <line x1="181" y1="194" x2="181" y2="212" stroke="#4A7FA0" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-blue)"/>

  <!-- Device FS -->
  <rect x="32" y="214" width="298" height="44" fill="#162F47" rx="6"/>
  <text x="181" y="232" text-anchor="middle" fill="#E8EEF4" font-size="12" font-weight="600">Device Filesystem</text>
  <text x="181" y="248" text-anchor="middle" fill="#5B8BAA" font-size="10">photos queued · survives app restart</text>

  <!-- Insight badge -->
  <rect x="32" y="270" width="298" height="20" fill="#0B1E30" rx="4"/>
  <text x="181" y="284" text-anchor="middle" fill="#F08948" font-size="9.5" font-weight="600">No UI screen ever handles an "offline" state</text>

  <!-- ── RECONNECT ARROW ── -->
  <line x1="346" y1="185" x2="454" y2="185" stroke="#F08948" stroke-width="2.5" marker-end="url(#arr-orange)"/>
  <text x="400" y="174" text-anchor="middle" fill="#F08948" font-size="9.5" font-weight="700" letter-spacing="0.5">on reconnect</text>
  <text x="400" y="200" text-anchor="middle" fill="#5B8BAA" font-size="9">queue drains in order</text>

  <!-- ── SUPABASE ZONE ── -->
  <rect x="454" y="44" width="330" height="256" fill="#0F2638" rx="8" stroke="#1D3D5E" stroke-width="1.5"/>
  <text x="470" y="64" fill="#F08948" font-size="9.5" font-weight="700" letter-spacing="2">SUPABASE</text>

  <!-- Sync Orchestrator -->
  <rect x="470" y="74" width="298" height="52" fill="#162F47" rx="6" stroke="#1D3D5E" stroke-width="1"/>
  <text x="619" y="94" text-anchor="middle" fill="#E8EEF4" font-size="12" font-weight="600">Sync Orchestrator</text>
  <text x="619" y="110" text-anchor="middle" fill="#5B8BAA" font-size="10">photos first → catch row · exponential backoff</text>

  <!-- Arrows down to DB + Storage -->
  <line x1="555" y1="126" x2="530" y2="146" stroke="#4A7FA0" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="685" y1="126" x2="710" y2="146" stroke="#4A7FA0" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- PostgreSQL -->
  <rect x="470" y="148" width="136" height="48" fill="#162F47" rx="6"/>
  <text x="538" y="168" text-anchor="middle" fill="#E8EEF4" font-size="12" font-weight="600">PostgreSQL</text>
  <text x="538" y="184" text-anchor="middle" fill="#5B8BAA" font-size="10">catch row committed</text>

  <!-- Storage -->
  <rect x="632" y="148" width="136" height="48" fill="#162F47" rx="6"/>
  <text x="700" y="168" text-anchor="middle" fill="#E8EEF4" font-size="12" font-weight="600">Storage</text>
  <text x="700" y="184" text-anchor="middle" fill="#5B8BAA" font-size="10">photos uploaded</text>

  <!-- Arrow from DB to trigger -->
  <line x1="538" y1="196" x2="538" y2="216" stroke="#4A7FA0" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-blue)"/>

  <!-- AFTER INSERT Trigger -->
  <rect x="470" y="218" width="298" height="48" fill="#162F47" rx="6"/>
  <text x="619" y="237" text-anchor="middle" fill="#E8EEF4" font-size="12" font-weight="600">AFTER INSERT Trigger</text>
  <text x="619" y="253" text-anchor="middle" fill="#5B8BAA" font-size="10">PR detection · conditions enrichment · server is truth</text>

  <!-- Insight badge -->
  <rect x="470" y="278" width="298" height="12" fill="#0B1E30" rx="4"/>
  <text x="619" y="288" text-anchor="middle" fill="#5B8BAA" font-size="9">trigger fires at commit time regardless of when catch was logged</text>
</svg>
